<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Simplicity Wins (سيمليسيتي وينز) - Luxury Fashion Admin Dashboard">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Simplicity Wins">
  <link rel="apple-touch-icon" href="logo.webp">

  <!-- Favicon Logo -->
  <link rel="icon" type="image/webp" href="logo.webp"/>
  <link rel="shortcut icon" type="image/webp" href="logo.webp"/>

  <title>Simplicity Wins - لوحة التحكم والإدارة</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #171715;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      direction: rtl;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }

    .logo-pulse {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: pulse 1.8s infinite ease-in-out;
    }

    .loader-title {
      color: #F7F6F2;
      font-size: 16px;
      font-weight: 700;
      margin-top: 20px;
      letter-spacing: 1px;
    }

    .loader-subtitle {
      color: #A38A65;
      font-size: 12px;
      margin-top: 4px;
    }

    .progress-bar-container {
      width: 140px;
      height: 3px;
      background-color: #2E2E2A;
      border-radius: 3px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-value {
      width: 40%;
      height: 100%;
      background-color: #A38A65;
      border-radius: 3px;
      position: absolute;
      animation: loadingBar 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(163, 138, 101, 0.4);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 25px 5px rgba(163, 138, 101, 0.3);
      }
      100% {
        transform: scale(0.96);
        box-shadow: 0 0 0 0 rgba(163, 138, 101, 0.4);
      }
    }

    @keyframes loadingBar {
      0% {
        right: -40%;
      }
      50% {
        right: 100%;
      }
      100% {
        right: -40%;
      }
    }
  </style>
</head>
<body>
  <!-- Brand Preloader -->
  <div id="loading-container">
    <img src="logo.webp" alt="Simplicity Wins Logo" class="logo-pulse" />
    <div class="loader-title">سيمليسيتي وينز</div>
    <div class="loader-subtitle">جاري تحميل لوحة التحكم...</div>
    <div class="progress-bar-container">
      <div class="progress-bar-value"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
